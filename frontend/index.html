<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPlace - Sistema de Mentoría Académica</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span>StudyPlace</span>
      </a>
      <nav>
        <ul class="nav-links" id="menu-navegacion">
          <li><a href="paginas/login.html" class="btn btn-secondary">Iniciar Sesión</a></li>
          <li><a href="paginas/registro.html" class="btn btn-primary">Registrarse</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1 class="hero-title">Mentorías universitarias</h1>
      <p class="hero-subtitle">
        Encuentra tutores calificados por materia y día, agenda tus sesiones académicas,
        confirma asistencia y gana puntos de experiencia.
      </p>
      <div class="hero-actions">
        <a href="paginas/login.html" class="btn btn-primary">Comenzar ahora</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 StudyPlace - Plataforma de Mentoría Académica</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const menu = document.getElementById('menu-navegacion');
      const token = API.obtenerToken();

      if (!token || !menu) return;

      try {
        const respuesta = await API.fetch('auth/me.php');
        const usuario = respuesta?.datos?.usuario;

        if (usuario) {
          const liUsuario = document.createElement('li');
          liUsuario.style.fontSize = '0.875rem';
          liUsuario.style.color = 'var(--color-text-muted)';
          liUsuario.textContent = `Hola, ${usuario.nombre} (${usuario.rol})`;

          const liLogout = document.createElement('li');
          const btnLogout = document.createElement('button');
          btnLogout.type = 'button';
          btnLogout.id = 'btn-logout';
          btnLogout.className = 'btn btn-secondary';
          btnLogout.textContent = 'Cerrar Sesión';

          btnLogout.addEventListener('click', async () => {
            try {
              await API.fetch('auth/logout.php', { method: 'POST' });
            } catch (_) {
            } finally {
              API.eliminarToken();
              localStorage.removeItem(window.API_CONFIG?.USER_KEY || 'studyplace_user');
              window.location.reload();
            }
          });

          liLogout.appendChild(btnLogout);

          menu.innerHTML = '';
          menu.appendChild(liUsuario);
          menu.appendChild(liLogout);
        }
      } catch (_) {
        API.eliminarToken();
        localStorage.removeItem(window.API_CONFIG?.USER_KEY || 'studyplace_user');
      }
    });
  </script>
</body>
</html>
