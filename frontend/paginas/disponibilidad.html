<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPlace - Mi Disponibilidad</title>
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="../index.html" class="logo"><span>StudyPlace</span></a>
      <button class="menu-toggle" id="btn-menu-toggle" aria-label="Abrir menú">&#9776;</button>
      <nav><ul class="nav-links" id="menu-navegacion"></ul></nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Mi Disponibilidad</h1>
        <p class="page-subtitle">Define las materias que enseñas y los horarios en los que puedes atender tutorías.</p>
      </div>
    </div>

    <div id="alerta-global" class="alert"></div>

    <section class="card-section">
      <div class="section-actions">
        <h2>Horarios configurados</h2>
        <button class="btn btn-primary" id="btn-nueva-disponibilidad" type="button">+ Nuevo horario</button>
      </div>
      <div class="table-responsive">
        <table class="table-custom">
          <thead><tr><th>Materia</th><th>Día</th><th>Hora inicio</th><th>Hora fin</th><th>Acciones</th></tr></thead>
          <tbody id="tabla-disponibilidad"><tr><td colspan="5">Cargando...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal-disponibilidad">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-disponibilidad-titulo">Nuevo horario</h3>
        <button class="modal-close" type="button">&times;</button>
      </div>
      <form id="form-disponibilidad">
        <div class="modal-body">
          <input type="hidden" id="disponibilidad-id">
          <div class="form-group">
            <label class="form-label" for="disponibilidad-materia">Materia *</label>
            <select class="form-select" id="disponibilidad-materia" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="disponibilidad-dia">Día *</label>
            <select class="form-select" id="disponibilidad-dia" required>
              <option value="lunes">Lunes</option><option value="martes">Martes</option>
              <option value="miercoles">Miércoles</option><option value="jueves">Jueves</option>
              <option value="viernes">Viernes</option><option value="sabado">Sábado</option>
              <option value="domingo">Domingo</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group"><label class="form-label" for="disponibilidad-inicio">Hora inicio *</label><input class="form-input" type="time" id="disponibilidad-inicio" required></div>
            <div class="form-group"><label class="form-label" for="disponibilidad-fin">Hora fin *</label><input class="form-input" type="time" id="disponibilidad-fin" required></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-modal-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>&copy; 2026 StudyPlace</p></div></footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/componentes/menu.js"></script>
  <script src="../js/componentes/layout.js"></script>
  <script src="../js/controladores/disponibilidadControlador.js"></script>
</body>
</html>
