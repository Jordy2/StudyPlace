<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPlace - Mi Disponibilidad</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/modulos4-5.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="../index.html" class="logo"><span>StudyPlace</span></a>
      <button class="menu-toggle" id="btn-menu-toggle" aria-label="Abrir menú">&#9776;</button>
      <nav><ul class="nav-links" id="menu-navegacion"></ul></nav>
    </div>
  </header>

  <main class="container module-main">
    <section class="module-panel">
      <div class="module-heading">
        <h1>Mi disponibilidad</h1>
        <p>Define únicamente días y rangos horarios generales (sin duplicar materias).</p>
        <p class="module-help">Tus materias se gestionan desde <a href="perfil.html">Mi Perfil</a>.</p>
      </div>

      <div id="alerta-global" class="alert" role="alert" aria-live="polite"></div>

      <form id="form-disponibilidad" class="availability-editor">
        <div class="availability-fields">
          <div class="form-group">
            <label class="form-label" for="disponibilidad-dia">Día de la semana</label>
            <select class="form-select" id="disponibilidad-dia" required>
              <option value="lunes">Lunes</option><option value="martes">Martes</option>
              <option value="miercoles">Miércoles</option><option value="jueves">Jueves</option>
              <option value="viernes">Viernes</option><option value="sabado">Sábado</option>
              <option value="domingo">Domingo</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="disponibilidad-inicio">Hora de inicio</label>
            <input class="form-input" type="time" id="disponibilidad-inicio" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="disponibilidad-fin">Hora de fin</label>
            <input class="form-input" type="time" id="disponibilidad-fin" required>
          </div>
          <div class="availability-form-actions">
            <button class="btn btn-primary" id="btn-guardar-disponibilidad" type="submit">+ Agregar franja</button>
          </div>
        </div>
      </form>

      <div id="tabla-disponibilidad" class="availability-list" aria-live="polite">
        <p class="availability-empty">Cargando horarios...</p>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal-editar-disponibilidad" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-editar-titulo">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-editar-titulo">Editar franja de disponibilidad</h2>
        <button class="modal-close" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <form id="form-editar-disponibilidad">
        <div class="modal-body">
          <input type="hidden" id="editar-disponibilidad-id">
          <div id="alerta-editar-disponibilidad" class="alert" role="alert" aria-live="polite"></div>
          <div class="form-group">
            <label class="form-label" for="editar-disponibilidad-dia">Día de la semana</label>
            <select class="form-select" id="editar-disponibilidad-dia" required>
              <option value="lunes">Lunes</option><option value="martes">Martes</option>
              <option value="miercoles">Miércoles</option><option value="jueves">Jueves</option>
              <option value="viernes">Viernes</option><option value="sabado">Sábado</option>
              <option value="domingo">Domingo</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="editar-disponibilidad-inicio">Hora de inicio</label>
              <input class="form-input" type="time" id="editar-disponibilidad-inicio" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="editar-disponibilidad-fin">Hora de fin</label>
              <input class="form-input" type="time" id="editar-disponibilidad-fin" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-cancelar-edicion" type="button">Cancelar</button>
          <button class="btn btn-primary" type="submit">Guardar cambios</button>
        </div>
      </form>
    </section>
  </div>

  <footer class="footer"><div class="container"><p>&copy; 2026 StudyPlace</p></div></footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/componentes/menu.js"></script>
  <script src="../js/componentes/layout.js"></script>
  <script src="../js/controladores/disponibilidadControlador.js"></script>
</body>
</html>
