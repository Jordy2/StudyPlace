<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - StudyPlace</title>
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="../index.html" class="logo">
        <span>StudyPlace</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="../index.html" class="nav-link">Inicio</a></li>
          <li><a href="registro.html" class="btn btn-primary">Registrarse</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container auth-container">
    <section class="auth-card">
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder a la plataforma</p>

      <div id="alerta" class="alert" role="alert" aria-live="polite"></div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label class="form-label" for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            class="form-input"
            placeholder="estudiante@studyplace.local"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
          Iniciar Sesión
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta aún? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 StudyPlace - Plataforma de Mentoría Académica</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/controladores/authControlador.js"></script>
</body>
</html>
