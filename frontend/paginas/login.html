<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - StudyPlace</title>
  <link rel="stylesheet" href="../css/base.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="../index.html" class="logo">
        <span>StudyPlace</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="../index.html" class="nav-link">Inicio</a></li>
          <li><a href="registro.html" class="btn btn-primary">Registrarse</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container auth-container">
    <section class="auth-card">
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder a la plataforma</p>

      <div id="alerta" class="alert" role="alert" aria-live="polite"></div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label class="form-label" for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            class="form-input"
            placeholder="estudiante@studyplace.local"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-password" data-target="password" aria-label="Mostrar contraseña" title="Mostrar u ocultar contraseña">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-closed" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
          Iniciar Sesión
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta aún? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 StudyPlace - Plataforma de Mentoría Académica</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/controladores/authControlador.js"></script>
</body>
</html>
